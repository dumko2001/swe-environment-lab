schema_version = "1.0"
artifacts = ["/app/verifier-artifacts/candidate.tar.gz", "/app/verifier-artifacts/candidate.sha256"]

[metadata]
author_organization = "Not specified"
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "A Prometheus storage maintainer is fixing unknown-series-reference warnings during log checkpointing and restart. Humans and agents must connect when an inactive series is removed from memory with how long its labels must remain on disk for samples that still refer to it. The production fix is small, but diagnosing the time boundary and demonstrating that recovery preserves data requires following eviction, checkpoint creation and replay. The task uses real upstream source and real WAL/checkpoint operations with small synthetic sample histories that reproduce a production compaction/restart sequence."
solution_explanation = "Track evicted-series retention in the same timestamp domain used by checkpoint truncation so label records remain while referenced and expire after the relevant sample horizon."
verification_explanation = "A separate verifier validates the checksummed source artifact, restores pinned module metadata and tests, and compiles with cgo disabled. A root-owned controller gives randomized timestamps, labels, and scalar sample values to an execute-only non-test candidate program running as UID 65532 with no capabilities or network, then a separately compiled clean-parent reader decodes the resulting checkpoint without linking candidate code. Reward requires correct selected/active series membership both at the inclusive retention boundary and after expiry, exact compacted sample timestamps and float bits (including the stale marker), and exact surviving active samples. A pre-cutoff active sample may already be truncated; if retained it must be unchanged. Linked regression tests independently check durable checkpoint expiry before and after reopening the database, replay metrics, and active-series survival after all source and verifier assets become inaccessible to candidate code."
category = "Observability"
tags = ["prometheus", "tsdb", "wal", "checkpoint", "stale-series", "recovery"]
expert_time_estimate_hours = 3.0
relevant_experience = "Prometheus TSDB, WAL/checkpoint formats, stale markers, compaction, and replay"

[verifier]
environment_mode = "separate"
timeout_sec = 1200.0

[verifier.environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 180.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar --exclude='prometheus/.git' --exclude='prometheus/.cache' --exclude='prometheus/web/ui/node_modules' --exclude='prometheus/prometheus' --exclude='prometheus/promtool' -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 5400.0
user = "agent"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "public"

[environment.healthcheck]
command = "/usr/local/bin/task-env start"
timeout_sec = 180.0
interval_sec = 5.0
retries = 3
