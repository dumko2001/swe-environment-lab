schema_version = "1.0"

artifacts = [
  "/app/verifier-artifacts/candidate.tar.gz",
  "/app/verifier-artifacts/candidate.sha256",
]

[metadata]
author_organization = "Not specified"
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
category = "Observability"
tags = ["victoriametrics", "metricsql", "query-engine", "vector-matching"]
expert_time_estimate_hours = 3.0
relevant_experience = "Go query engines and time-series vector matching"
difficulty_explanation = "A VictoriaMetrics maintainer implementing sparse-metric dashboard arithmetic must preserve MetricsQL semantics for independently scraped time series whose labels and sample timestamps only partially overlap. The change crosses evaluation order, label-filter propagation, vector matching, and per-sample missingness. A locally correct fill loop still loses unmatched series when earlier query optimization discards them. Fixtures are author-generated synthetic sparse series representing partially overlapping scrapes, not production data."
solution_explanation = "The upstream reference preserves absent operands through matching, fills only the missing side at each timestamp, and adjusts filter propagation and evaluation order to retain the appropriate unmatched series. Equivalent implementations are accepted."
verification_explanation = "A separate no-network verifier compiles the candidate with the submitted vendored dependencies and drives the real server HTTP API. A private controller imports seeded series and independently computes expected values across fill directions, sparse scalar operands, matching, per-pair grouped missingness, disjoint-series merging, nested expressions, comparisons, invalid cardinality, and unchanged behavior. It requires exact label sets, sample counts, and timestamps. Numerical comparisons allow relative and absolute tolerance of 1e-9 to accommodate floating-point arithmetic and JSON serialization in equivalent implementations; missing or fabricated samples remain exact failures. Candidate code executes without privileges or access to verifier source, reward files, or trusted inputs. These 1e-9 comparisons passed for both the reference and an alternate valid implementation in retained local and Daytona runs; that establishes acceptance of those implementations, not universal numerical calibration."

[verifier]
environment_mode = "separate"
timeout_sec = 900.0

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 120.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/victoriametrics
chmod -R a-w /app/victoriametrics
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar \
  --exclude='victoriametrics/.git' \
  --exclude='victoriametrics/.cache' \
  --exclude='victoriametrics/node_modules' \
  --exclude='victoriametrics/victoria-metrics' \
  -czf "$out/candidate.tar.gz" victoriametrics
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "public"

[environment.healthcheck]
command = "/usr/local/bin/task-env start"
timeout_sec = 180.0
interval_sec = 5.0
retries = 3
