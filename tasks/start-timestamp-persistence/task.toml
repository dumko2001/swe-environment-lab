schema_version = "1.0"
artifacts = ["/app/verifier-artifacts/candidate.tar.gz", "/app/verifier-artifacts/candidate.sha256"]

[metadata]
author_organization = "Not specified"
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "A Prometheus storage maintainer is adding an optional way to retain the start time of a histogram measurement through storage and recovery. Humans and agents must coordinate both histogram types across writing, reading, restart, out-of-order data and compaction. Updating only one path can appear to work until a restart or a different reader silently loses information, while existing files and disabled-feature behavior must remain usable. The task uses real upstream storage code with synthetic histogram samples varied across resets and bucket layouts; writing and reopening actual WALs and blocks reproduces the persistence paths used in production."
solution_explanation = "The reference adds new histogram storage formats only when the feature is enabled, then carries each sample start time through every writer and reader. It keeps the old formats when disabled and controls this feature independently from float-sample encoding, so existing data and other configuration choices keep working."
verification_explanation = "A separate verifier validates the checksummed artifact, restores pinned module metadata, and compiles with cgo disabled. A root-owned controller gives randomized integer and float histogram lifecycles to execute-only candidate binaries running as UID 65532 without capabilities. Candidate probes use the existing command feature parser and TSDB configuration conversion for histograms-st-encoding, without assuming a new option field name, index, or boolean representation. A non-test candidate program performs WAL/WBL restart and normal/out-of-order compaction and emits TSDB artifacts containing mixed zero and nonzero start timestamps, large bucket deltas, varied schemas, counter-reset hints, gauges, a compatible within-series bucket-layout expansion, a zero-threshold transition, and stale-marker recovery. A verifier-owned reader compiled against candidate code uses only the pre-existing public query and iterator APIs plus that public-feature configuration path. Reward requires its output to match the complete expected histogram semantics: schema, zero threshold and count, nonzero bucket populations keyed by side and index, custom bounds, counter-or-gauge state, count, sum, exact sample cardinality, and a fresh iterator Seek result. Equivalent span segmentation is accepted. A second root-only reader built from the exact landed patch must decode the same sealed blocks and return identical receipts, checking the persistent wire contract supplied to the agent in /app/histogram-st-format.md without requiring the candidate to use the patch's Go identifiers or source organization. A root-only writer compiled against the clean parent independently creates durable legacy integer and float artifacts; the candidate reader must recover those exactly with zero start timestamps. The controller also launches the candidate Prometheus binary with baseline, histogram-only, XOR2-only, and combined public feature flags and checks the externally reported TSDB feature states. A compactness fixture compares 130 constant-start-timestamp samples with the disabled encoding and permits 64 extra block bytes. This is an explicit author-defined efficiency allowance for header and first-timestamp overhead, not a claimed upstream constant; reference and compatible-alternate controls must satisfy it."
category = "Observability"
tags = ["prometheus", "tsdb", "wal", "chunk-encoding", "native-histogram", "feature-flag"]
expert_time_estimate_hours = 16.0
relevant_experience = "Prometheus TSDB internals, binary codecs, WAL/WBL replay, out-of-order storage, and compatibility design"

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 240.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
rm -f /app/prometheus/go.work.sum
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar --exclude='prometheus/.git' --exclude='prometheus/.cache' --exclude='prometheus/web/ui/node_modules' --exclude='prometheus/prometheus' --exclude='prometheus/promtool' -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 57600.0
user = "agent"

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "public"

[environment.healthcheck]
command = "/usr/local/bin/task-env start"
timeout_sec = 180.0
interval_sec = 5.0
retries = 3
