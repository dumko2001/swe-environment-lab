schema_version = "1.0"

artifacts = [
  "/app/verifier-artifacts/candidate.tar.gz",
  "/app/verifier-artifacts/candidate.sha256",
]

[metadata]
author_organization = "Not specified"
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "The task requires tracing a temporal-semantics regression through PromQL AST preprocessing and engine evaluation. A locally attractive optimization treats a fixed-time subquery as one reusable value, but a surrounding function can still require different results at each outer step. A Prometheus maintainer would diagnose this by reconciling parser structure, instant/range behavior, nested expressions, and regression coverage. The failure comes from a real upstream regression. Synthetic time series and query expressions reproduce its temporal behavior through the real parser, evaluator and HTTP service."
solution_explanation = "The reference preserves step invariance inside a subquery while preventing the subquery node itself from being wrapped as a globally reusable expression. This retains the valid inner optimization but allows the caller to evaluate the subquery result correctly at every outer step."
verification_explanation = "After the agent phase, Harbor snapshots the candidate source into a checksum-addressed archive and destroys the agent container. A separate no-network verifier builds the submitted Prometheus server, and drives its HTTP API with verifier-owned fixed-time range and instant queries plus ordinary-subquery controls. A verifier-owned execution probe observes real engine function-call counts to reject repeated invariant computation and independently checks time-dependent results, without requiring a particular AST representation. The controller also independently computes expected quantiles and checks fixed expressions inside nested subqueries. Relative numeric bounds of 1e-10 for HTTP results and 1e-12 for in-process results allow float64 interpolation/serialization rounding; timestamps, complete label sets, result counts and invariant call-count bounds remain exact. The same numeric tolerance applies both to independent expected values and direct-versus-subquery comparisons. The reference and an alternative parenthesized invariant representation pass the execution probe; this validates that representation alternative, not every possible correct numerical algorithm. Clean-parent, reference, alternate-valid, and mutant calibration are separate author-side release gates rather than claims inferred by the per-trial verifier. Standalone fixed subqueries must retain identical matrix values and timestamps through parentheses, including numeric and start/end fixed-time modifiers; these are evaluated through the engine and HTTP API without AST-shape checks."
category = "Observability"
tags = ["prometheus", "promql", "debugging", "query-engine", "temporal-semantics"]
expert_time_estimate_hours = 1.5
relevant_experience = "Prometheus query-engine internals, Go, temporal query semantics, and regression testing"

[verifier]
environment_mode = "separate"
timeout_sec = 900.0

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 120.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar \
  --exclude='prometheus/.git' \
  --exclude='prometheus/.cache' \
  --exclude='prometheus/web/ui/node_modules' \
  --exclude='prometheus/prometheus' \
  --exclude='prometheus/promtool' \
  -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
network_mode = "public"

[environment.healthcheck]
command = "/usr/local/bin/task-env start"
timeout_sec = 180.0
interval_sec = 5.0
retries = 3
